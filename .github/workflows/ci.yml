name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + pure-logic tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Headless Chromium + its system libraries for the dashboard browser
          # tests (ADR-030); without it those tests skip rather than fail.
          python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        # The pure-logic modules: RAG chunking, plan parsing, prompt building,
        # frontier selection, the scene descriptor, the SQLite zone store, the
        # room-meaning table (ADR-022), the teleop deadman (ADR-023), scene
        # merging and memory compaction (ADR-025), the
        # ChromaDB wrapper, and the dashboard's HTTP layer — which is kept free
        # of rclpy precisely so it can be covered here (ADR-018).
        run: pytest tests/

  ros-node-tests:
    name: ROS node tests (colcon test)
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS and system dependencies
        # cv_bridge + opencv for perceive_skill, nav2_simple_commander for
        # nav_skill, rosidl generators to build robot_interfaces.
        # ros:jazzy-ros-base ships no pip at all, hence python3-pip.
        #
        # KEEP IN SYNC with the apt list in the root Dockerfile, which mirrors
        # this job deliberately (ADR-021). A package added here must be added
        # there, or the container stops reproducing what CI verifies.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-opencv \
            python3-pip \
            python3-pytest \
            ros-jazzy-cv-bridge \
            ros-jazzy-nav2-simple-commander \
            ros-jazzy-rosidl-default-generators \
            ros-jazzy-tf2-ros

      - name: Install Python dependencies
        # Only what the nodes under test import at module load. `ollama` is the
        # client library, imported by llm_planner_node — no server is needed to
        # start the node. Deliberately NOT chromadb: rag_node ingests against a
        # live Ollama server on startup and is excluded from this job (ADR-018).
        # numpy comes from apt so it keeps matching cv_bridge's ABI.
        run: |
          python3 -m pip install --break-system-packages \
            fastapi uvicorn httpx pillow pydantic ollama

      - name: Build workspace
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install

      - name: Run node tests
        env:
          # The launch_testing pytest plugin shipped with Jazzy is incompatible
          # with current pytest and breaks collection. Nothing here uses it.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          # Keep DDS discovery on this container's loopback.
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          export ROBOT_WS="$GITHUB_WORKSPACE"
          colcon test --event-handlers console_direct+
          colcon test-result --all --verbose
