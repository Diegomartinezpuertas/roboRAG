name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    name: Lint + unit tests (no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        # These tests exercise the pure-logic modules (RAG chunking, plan
        # parsing, prompt building, frontier selection, the SQLite zone store,
        # the ChromaDB wrapper) without needing a ROS 2 install. The nodes and
        # ROS wiring are covered by `colcon test` locally (see README).
        run: pytest tests/
