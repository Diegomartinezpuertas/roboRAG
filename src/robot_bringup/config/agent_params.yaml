# Tuning parameters only. Filesystem paths (zones_db, chroma_db_path,
# knowledge_dir, logs_dir) are deliberately NOT set here: each node derives its
# default from the ROBOT_WS environment variable (exported by setup_env.sh), so
# the workspace is not pinned to one developer's home directory. Override an
# individual path with `ros2 run ... --ros-args -p zones_db:=/some/path` or by
# re-adding the key under the relevant node below.

llm_planner_node:
  ros__parameters:
    ollama_base_url: "http://localhost:11434"
    llm_model: "qwen2.5:7b"
    max_plan_steps: 10
    # Calibrated for bge-m3 (see docs/rag-analysis.md): correct-match scores
    # start at ~0.43, so 0.40 acts as a floor against off-topic noise while
    # the LLM disambiguates within the surviving top-k. (For nomic-embed-text
    # the calibrated value was 0.45.)
    rag_score_threshold: 0.40

rag_node:
  ros__parameters:
    ollama_base_url: "http://localhost:11434"
    # bge-m3 over nomic-embed-text: measured Spanish-query top-1 43% -> 86%
    # on this project's English memories (see docs/rag-analysis.md §2.4).
    # If you change this, delete data/chroma_db (embedding dims differ) and
    # re-seed; consider recalibrating rag_score_threshold.
    embedding_model: "bge-m3"
    collections:
      - "semantic_map"
      - "knowledge_base"
      - "task_history"
    top_k_default: 5
    # A re-observed place with the same look (colour set + clutter class), zone
    # and map session within this many meters merges into its existing memory
    # instead of being stored again (ADR-025). A TurtleBot3-house room is 3-4 m
    # across; 0 disables merging.
    scene_merge_radius: 2.0

# skills_executor_node and cmd_vel_mux_node are omitted: their tuning parameters
# (explore_strategy; the mux topics and timeouts) keep their code defaults,
# documented in docs/api_reference.md, and their paths come from ROBOT_WS. An
# empty `ros__parameters:` block is invalid for the parameter loader, so no
# stanza is better than an empty one.

dashboard_node:
  ros__parameters:
    # Loopback only. The HTTP API can publish goals to the robot and has no
    # authentication, so binding 0.0.0.0 would hand robot control to anyone
    # on the network. Still reachable from a Windows browser under WSL2:
    # its localhost relay forwards into the VM's loopback. Set "0.0.0.0"
    # here only to reach the dashboard from another machine.
    http_host: "127.0.0.1"
    http_port: 8080
